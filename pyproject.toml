[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-recap"
version = "0.1.0"
description = "Turn raw GoPro cycling footage and Garmin FIT telemetry into highlight reels with burned-in data overlays"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ian Macomber" }]
keywords = ["cycling", "gopro", "garmin", "fit", "video", "ffmpeg", "gemini", "strava"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "fitparse>=1.2.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "click>=8.1.0",
    "pydantic-settings>=2.0",
    "google-genai>=1.0",
    # >=1.66 ships client.responses.parse (Responses API + Structured Outputs).
    # 1.40 has no Responses resource — do not lower this floor.
    "openai>=1.66.0",
    "garminconnect>=0.3.0",
    "flask>=3.0",
    "streamlit>=1.35.0",
    "requests>=2.31",
    "timezonefinder>=6.0",
    "tzlocal>=5.0",
]

[project.urls]
Homepage = "https://github.com/ianmacomber/ride-recap"
Issues = "https://github.com/ianmacomber/ride-recap/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
# Both names run the same CLI. `gopro-garmin` is the original and is what the
# docs and figures use; `ride-recap` matches the project name.
gopro-garmin = "gopro_garmin_pipeline.cli:main"
ride-recap = "gopro_garmin_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gopro_garmin_pipeline = [
    "design/tokens.json",
    "components/ride_scrubber/index.html",
    "assets/fonts/*",
    "prompts/README.md",
    "prompts/*/*.md",
    "web/templates/*.html",
    "web/static/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than inherited. The dev extra floats ruff, and
# ruff 0.16 widened its default rule set — which turned a routine release
# into 125 lint errors on an unchanged tree and a red CI on every open PR.
# These four are the set the codebase was written against; widening it is a
# deliberate change with its own cleanup, not something a release does for us.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
